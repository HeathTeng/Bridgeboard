# Builds the Windows portable zip and the Mac zip (trial) and attaches them to a GitHub Release.
# Push a tag like v0.2.0 to publish, or run it by hand from the Actions tab.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build the portable zip
        run: scripts/build-portable.sh "${{ github.event.inputs.version || github.ref_name }}"
      # After the Windows build, which empties dist/ first. A trial: if it fails,
      # the Windows zips are still published (the step shows red in Actions).
      - name: Build the Mac zip
        continue-on-error: true
        run: bash scripts/build-mac.sh "${{ github.event.inputs.version || github.ref_name }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          notes="Bridgeboard（Blackboard 学习面板）Windows 便携版：下载 Bridgeboard-$VERSION-windows.zip 或 Bridgeboard-Windows.zip（两个是同一个文件），解压后双击 start.bat 即可使用，不需要安装 Node.js。从旧版本升级不用搬任何东西，清单和设置都会保留。详细步骤见 README。Mac 版是试用版：下载 Bridgeboard-$VERSION-mac.zip 或 Bridgeboard-Mac.zip（两个是同一个文件），解压后双击 start.command；第一次打开要在系统里放行一次，步骤见压缩包里的 HOW-TO-USE.txt。"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.zip --clobber
          else
            gh release create "$VERSION" dist/*.zip --title "$VERSION" --notes "$notes" --target "$GITHUB_SHA"
          fi
